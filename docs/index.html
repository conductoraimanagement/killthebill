<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kill the Bill — Design Documentation</title>
    <meta name="description" content="Design documentation for Kill the Bill — a procedural immersive sim about toppling an oligarchy.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <a class="brand" href="#/README.md">
                <span class="brand-mark"></span>
                <span class="brand-text">KILL THE <em>BILL</em></span>
            </a>
            <div class="ticker">
                <div id="ticker-track" class="ticker-track"></div>
            </div>
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">MENU</button>
        </header>

        <aside id="sidenav" class="sidenav">
            <div id="sidenav-inner"></div>
        </aside>

        <main id="content" class="main"></main>

        <aside class="toc">
            <div id="toc-inner"></div>
        </aside>
    </div>

    <script src="assets/app.js"></script>

</html>
